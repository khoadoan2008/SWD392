server:
  port: 8080

spring:
  application:
    name: aives-backend

  config:
    import: optional:file:./config.local.properties,optional:file:../config.local.properties

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  datasource:
    url: jdbc:postgresql://localhost:5432/aives
    username: postgres
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Không tự xóa/sửa schema mà kiểm tra khớp với schema hiện có
    show-sql: false # Avoid logging document content in database statements.
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration-ms: 86400000 # 24 giờ
