# Copy to config.local.properties in the repository root. Never commit your real key.
# Paste the key after = without quotation marks, then restart the backend.
GEMINI_API_KEY=
GEMINI_MODEL=gemini-3.8-flash
# Tried in order when GEMINI_MODEL is overloaded or too slow (comma separated, none = disabled).
GEMINI_FALLBACK_MODEL=gemini-3.5-flash,gemini-3.6-flash,gemini-3.5-flash-lite

# Database settings remain the team's PostgreSQL defaults in application.yml.
# Override on your machine with SPRING_DATASOURCE_URL / USERNAME / PASSWORD if needed.
